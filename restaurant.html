<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="./js/script.js"></script>
</head>
<body>
  <header class="header">
    <p>Restaurant Menu</p>
  </header>



  <div class="menu-container-vertical">
    <div class="menu-category" onclick="navigateTo('menu/ontbijt.html')">
      <h3>☕ Ontbijt</h3>
      <p>Begin je dag met een heerlijk ontbijt</p>
    </div>
    <div class="menu-category" onclick="navigateTo('menu/lunch.html')">
      <h3>🥗 Lunch</h3>
      <p>Geniet van een lekkere lunch</p>
    </div>
    <div class="menu-category" onclick="navigateTo('menu/diner.html')">
      <h3>🍽️ Diner</h3>
      <p>Beleef een culinair avondmaal</p>
    </div>
    <div class="menu-category" onclick="navigateTo('menu/dessert.html')">
      <h3>🍰 Dessert</h3>
      <p>Sluit af met een zoete traktatie</p>
    </div>
  </div>

  <div class="background-animation"></div>
  <div class="grid-overlay"></div>

  <script>
    function navigateTo(page) {
      window.location.href = page;
    }
  </script>
</body>
</html>
